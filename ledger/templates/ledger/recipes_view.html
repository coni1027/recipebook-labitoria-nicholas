{% extends 'base.html' %}

{% load static %}

{% block title %}
{{ recipe.name }}
{% endblock %}

{% block content %}
    <h1>
        {{ recipe.name }}
    </h1>
    
    <ol>
        {% for ingredient in recipe.ingredients.all %}
        <li>
            {{ ingredient.ingredient_field.name }} - {{ ingredient.quantity }}
        </li>
        {% endfor %}
    </ol>
    
    
{% endblock %}
