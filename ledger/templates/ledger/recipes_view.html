{% extends 'base.html' %}

{% load static %}

{% block title %}
{{ name }}
{% endblock %}

{% block content %}
    <h1>
        Recipe Book
    </h1>
    <ul>
        <a href="{{ link }}">{{ name }}</a>
    </ul>
    <ol>
        {% for ingredient in ingredients %}
        <li>
            {{ ingredient.name }} - {{ ingredient.quantity }}
        </li>
        {% endfor %}
    </ol>
    
    
{% endblock %}
